  <!-- Divider -->
  <line x1="106" y1="432" x2="1094" y2="432" stroke="#313244" stroke-width="1"/>

  <!-- Tags -->
  <!-- Java -->
  <rect x="106" y="452" width="72" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="142" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="500">Java</text>

  <!-- Spring Boot -->
  <rect x="190" y="452" width="118" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="249" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="500">Spring Boot</text>

  <!-- Spring Security -->
  <rect x="320" y="452" width="150" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="395" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="500">Spring Security</text>

  <!-- JWT -->
  <rect x="482" y="452" width="62" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="513" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="500">JWT</text>

  <!-- AWS -->
  <rect x="556" y="452" width="62" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="587" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="500">AWS</text>

  <!-- MariaDB -->
  <rect x="630" y="452" width="90" height="30" rx="15" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-opacity="0.35" stroke-width="1"/>
  <text x="675" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
