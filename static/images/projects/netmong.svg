  <!-- Corner accent -->
  <rect x="1080" y="28" width="92" height="4" rx="2" fill="#a6e3a1" fill-opacity="0.5"/>
  <rect x="1100" y="40" width="72" height="4" rx="2" fill="#a6e3a1" fill-opacity="0.3"/>
  <rect x="1118" y="52" width="54" height="4" rx="2" fill="#a6e3a1" fill-opacity="0.15"/>
