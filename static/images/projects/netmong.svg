<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-n" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-n)"/>

  <!-- Decorative circles -->
  <circle cx="1120" cy="-80" r="320" fill="#a6e3a1" fill-opacity="0.05"/>
  <circle cx="80" cy="760" r="260" fill="#94e2d5" fill-opacity="0.04"/>
  <circle cx="950" cy="580" r="140" fill="#a6e3a1" fill-opacity="0.03"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="337" x2="1200" y2="337" stroke="#313244" stroke-width="0.5" opacity="0.5"/>
  <line x1="600" y1="0" x2="600" y2="675" stroke="#313244" stroke-width="0.5" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="80" y="226" width="5" height="96" rx="2.5" fill="#a6e3a1"/>

  <!-- Project name -->
  <text x="106" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="78" font-weight="700" fill="#cdd6f4" letter-spacing="-1">Netmong</text>

  <!-- Korean subtitle -->
  <text x="106" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
