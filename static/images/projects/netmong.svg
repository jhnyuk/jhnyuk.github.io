  <!-- Divider -->
  <line x1="106" y1="432" x2="1094" y2="432" stroke="#313244" stroke-width="1"/>

  <!-- Tags -->
  <!-- Java -->
  <rect x="106" y="452" width="72" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="142" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#a6e3a1" text-anchor="middle" font-weight="500">Java</text>

  <!-- Spring Boot -->
  <rect x="190" y="452" width="118" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="249" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#a6e3a1" text-anchor="middle" font-weight="500">Spring Boot</text>

  <!-- JavaScript -->
  <rect x="320" y="452" width="104" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="372" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#a6e3a1" text-anchor="middle" font-weight="500">JavaScript</text>

  <!-- React -->
  <rect x="436" y="452" width="76" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="474" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#a6e3a1" text-anchor="middle" font-weight="500">React</text>

  <!-- MariaDB -->
  <rect x="524" y="452" width="90" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="569" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" fill="#a6e3a1" text-anchor="middle" font-weight="500">MariaDB</text>

  <!-- AWS -->
  <rect x="626" y="452" width="62" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.12" stroke="#a6e3a1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="657" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
