<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-g)"/>

  <!-- Decorative circles -->
  <circle cx="1120" cy="-80" r="320" fill="#89b4fa" fill-opacity="0.05"/>
  <circle cx="80" cy="760" r="260" fill="#74c7ec" fill-opacity="0.04"/>
  <circle cx="950" cy="580" r="140" fill="#89b4fa" fill-opacity="0.03"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="337" x2="1200" y2="337" stroke="#313244" stroke-width="0.5" opacity="0.5"/>
  <line x1="600" y1="0" x2="600" y2="675" stroke="#313244" stroke-width="0.5" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="80" y="226" width="5" height="96" rx="2.5" fill="#89b4fa"/>

  <!-- Project name -->
  <text x="106" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
