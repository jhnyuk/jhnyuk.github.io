  <!-- Spring Boot -->
  <rect x="190" y="452" width="118" height="30" rx="15" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-opacity="0.35" stroke-width="1"/>
  <text x="249" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
